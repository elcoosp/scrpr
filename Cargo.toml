[package]
name = "scrpr"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Basic rust scraper and data selector"
authors = ["elcoosp"]
rust-version = "1.88"
documentation = "https://github.com/elcoosp/scrpr"
homepage = "https://github.com/elcoosp/scrpr"
repository = "https://github.com/elcoosp/scrpr"
keywords = ["scraper"]
categories = ["web-programming", "parsing"]

[dependencies]
reqwest = "0.13.5"
thiserror = "2.0.21"
futures = "0.3.34"
scraper = "0.29.0"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "time"] }

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
