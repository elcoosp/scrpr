[package]
name = "scrpr"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Typed, declarative web scraping: fetch pages concurrently with retries, rate limiting and caching, and extract them into your own types"
authors = ["elcoosp"]
rust-version = "1.88"
documentation = "https://docs.rs/scrpr"
homepage = "https://github.com/elcoosp/scrpr"
repository = "https://github.com/elcoosp/scrpr"
keywords = ["scraper", "scraping", "html", "extraction", "crawler"]
categories = ["web-programming", "parsing"]

[features]
default = ["json"]
# JSON-LD and embedded-JSON extraction (`Page::json_ld`, `field::json_ld`).
json = ["dep:serde_json"]

[dependencies]
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "zstd", "deflate", "cookies"] }
thiserror = "2.0.21"
futures = "0.3.34"
scraper = "0.29.0"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "time", "sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
encoding_rs = "0.8.44"
serde_json = { version = "1.0.154", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
